name: Format

on:
  push:
    branches:
      - main
    paths:
      - ".editorconfig"
      - "ExternalDnsNamesiloWebhook.sln"
      - "src/**"
      - ".github/workflows/format.yaml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExternalDnsNamesiloWebhook.sln

      - name: Verify formatting
        run: dotnet format ExternalDnsNamesiloWebhook.sln --verify-no-changes --no-restore
