name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild with refreshed base images and vulnerability scan (Monday 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExternalDnsNamesiloWebhook.sln

      - name: Check vulnerable NuGet packages
        run: dotnet list ExternalDnsNamesiloWebhook.sln package --vulnerable --include-transitive

      - name: Format
        run: dotnet format ExternalDnsNamesiloWebhook.sln --verify-no-changes

      - name: Build
        run: dotnet build ExternalDnsNamesiloWebhook.sln --no-restore -c Release

      - name: Test
        run: dotnet test ExternalDnsNamesiloWebhook.sln --no-build -c Release --verbosity normal

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=external-dns-namesilo-webhook
            org.opencontainers.image.description=ExternalDNS webhook provider for NameSilo DNS
            org.opencontainers.image.vendor=T012m3n7oR
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
