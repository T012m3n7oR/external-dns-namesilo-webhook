name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Build.props"
      - "ExternalDnsNamesiloWebhook.sln"
      - ".editorconfig"
      - "src/**"
      - ".github/workflows/publish.yaml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Build.props"
      - "ExternalDnsNamesiloWebhook.sln"
      - ".editorconfig"
      - "src/**"
      - ".github/workflows/publish.yaml"
  schedule:
    # Weekly rebuild with refreshed base images and vulnerability scan (Monday 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDX_BUILDER: homelab-buildkit

jobs:
  build-test-publish:
    runs-on: homelab-webhook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExternalDnsNamesiloWebhook.sln

      - name: Check vulnerable NuGet packages
        run: dotnet list ExternalDnsNamesiloWebhook.sln package --vulnerable --include-transitive

      - name: Format
        run: dotnet format ExternalDnsNamesiloWebhook.sln --verify-no-changes

      - name: Build
        run: dotnet build ExternalDnsNamesiloWebhook.sln --no-restore -c Release

      - name: Test
        run: dotnet test ExternalDnsNamesiloWebhook.sln --no-build -c Release --verbosity normal

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=external-dns-namesilo-webhook
            org.opencontainers.image.description=ExternalDNS webhook provider for NameSilo DNS
            org.opencontainers.image.vendor=T012m3n7oR
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}

      - name: Set up remote BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          name: homelab-buildkit
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
