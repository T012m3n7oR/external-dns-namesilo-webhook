name: Publish

on:
  push:
    branches:
      - main
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ExternalDnsNamesiloWebhook.sln"
      - ".editorconfig"
      - "src/**"
      - ".github/workflows/publish.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    # Weekly rebuild with refreshed base images and vulnerability scan (Monday 06:00 UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: Force a full rebuild (ignore Buildx/GHA cache)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BUILDX_BUILDER: homelab-buildkit

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'ci/no-cache')
    runs-on: external-dns-namesilo-webhook
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExternalDnsNamesiloWebhook.sln

      - name: Check vulnerable NuGet packages
        run: dotnet list ExternalDnsNamesiloWebhook.sln package --vulnerable --include-transitive

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GITHUB_REPOSITORY,,}"
          if [[ "$image_name" =~ [^a-z0-9./_-] ]]; then
            echo "Image name contains characters that are invalid in an OCI reference: $image_name" >&2
            exit 1
          fi
          echo "name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Format
        run: dotnet format ExternalDnsNamesiloWebhook.sln --verify-no-changes

      - name: Build
        run: dotnet build ExternalDnsNamesiloWebhook.sln --no-restore -c Release

      - name: Test
        run: dotnet test --project src/ExternalDnsNamesiloWebhook.Tests/ExternalDnsNamesiloWebhook.Tests.csproj --no-build -c Release --verbosity normal

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=external-dns-namesilo-webhook
            org.opencontainers.image.description=ExternalDNS webhook provider for NameSilo DNS
            org.opencontainers.image.vendor=T012m3n7oR
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}

      - name: Set up remote BuildKit
        uses: ./.github/actions/setup-remote-buildx

      - name: Configure BuildKit cache
        id: build-cache
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          branch_scope="external-dns-namesilo-webhook-branch-${REF_NAME}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_scope="external-dns-namesilo-webhook-pr-${PR_NUMBER}"
            {
              echo 'from<<CACHE_FROM'
              printf 'type=gha,scope=%s\n' "${branch_scope}"
              printf 'type=gha,scope=%s\n' "${pr_scope}"
              printf 'type=gha,scope=external-dns-namesilo-webhook-main\n'
              echo 'CACHE_FROM'
              echo 'to<<CACHE_TO'
              printf 'type=gha,mode=max,scope=%s\n' "${branch_scope}"
              printf 'type=gha,mode=max,scope=%s\n' "${pr_scope}"
              echo 'CACHE_TO'
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${REF_NAME}" == "main" ]]; then
            {
              echo 'from='
              echo 'to=type=gha,mode=max,scope=external-dns-namesilo-webhook-main'
            } >> "${GITHUB_OUTPUT}"
          else
            {
              printf 'from=type=gha,scope=%s\n' "${branch_scope}"
              printf 'to=type=gha,mode=max,scope=%s\n' "${branch_scope}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          pull: true
          no-cache: ${{ inputs.no_cache || github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci/no-cache')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: ${{ steps.build-cache.outputs.from }}
          cache-to: ${{ steps.build-cache.outputs.to }}
          outputs: type=oci,dest=${{ github.workspace }}/external-dns-namesilo-webhook.tar

      - name: Unpack OCI image for Trivy
        env:
          OCI_ARCHIVE: ${{ github.workspace }}/external-dns-namesilo-webhook.tar
          OCI_LAYOUT: ${{ github.workspace }}/external-dns-namesilo-webhook-oci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OCI_LAYOUT}"
          tar -xf "${OCI_ARCHIVE}" -C "${OCI_LAYOUT}"
          test -f "${OCI_LAYOUT}/index.json"
          test -f "${OCI_LAYOUT}/oci-layout"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Scan image with Trivy
        env:
          OCI_LAYOUT: ${{ github.workspace }}/external-dns-namesilo-webhook-oci
        shell: bash
        run: |
          set -euo pipefail
          trivy image \
            --input "${OCI_LAYOUT}" \
            --ignore-unfixed \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output trivy-results.json

      - name: Report all Trivy findings and enforce severity gate
        shell: bash
        run: |
          set -euo pipefail
          trivy convert --scanners vuln --format table \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL trivy-results.json
          trivy convert \
            --scanners vuln \
            --format table \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            trivy-results.json

      - name: Remove Trivy OCI layout
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        env:
          OCI_LAYOUT: ${{ github.workspace }}/external-dns-namesilo-webhook-oci
        shell: bash
        run: rm -rf -- "${OCI_LAYOUT}"

      - name: Install regctl
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.5

      - name: Log in regctl to GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: regclient/actions/regctl-login@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        env:
          OCI_ARCHIVE: ${{ github.workspace }}/external-dns-namesilo-webhook.tar
          REGCTL_LAYOUT: ${{ github.workspace }}/external-dns-namesilo-webhook-regctl-oci
          SOURCE_TAG: ${{ steps.meta.outputs.version }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          source_ref="ocidir://${REGCTL_LAYOUT}:${SOURCE_TAG}"
          regctl image import "${source_ref}" "${OCI_ARCHIVE}"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            regctl image copy --referrers "${source_ref}" "${tag}"
          done <<< "${RELEASE_TAGS}"
