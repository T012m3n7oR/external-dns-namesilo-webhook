name: Publish

on:
  push:
    branches:
      - main
      - 'renovate/**'
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ExternalDnsNamesiloWebhook.sln"
      - ".editorconfig"
      - "src/**"
      - ".github/workflows/publish.yaml"
  pull_request:
  schedule:
    # Weekly rebuild with refreshed base images and vulnerability scan (Monday 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BUILDX_BUILDER: homelab-buildkit

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: homelab-webhook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExternalDnsNamesiloWebhook.sln

      - name: Check vulnerable NuGet packages
        run: dotnet list ExternalDnsNamesiloWebhook.sln package --vulnerable --include-transitive

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GITHUB_REPOSITORY,,}"
          if [[ "$image_name" =~ [^a-z0-9./_-] ]]; then
            echo "Image name contains characters that are invalid in an OCI reference: $image_name" >&2
            exit 1
          fi
          echo "name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Format
        run: dotnet format ExternalDnsNamesiloWebhook.sln --verify-no-changes

      - name: Build
        run: dotnet build ExternalDnsNamesiloWebhook.sln --no-restore -c Release

      - name: Test
        run: dotnet test --project src/ExternalDnsNamesiloWebhook.Tests/ExternalDnsNamesiloWebhook.Tests.csproj --no-build -c Release --verbosity normal

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=external-dns-namesilo-webhook
            org.opencontainers.image.description=ExternalDNS webhook provider for NameSilo DNS
            org.opencontainers.image.vendor=T012m3n7oR
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}

      - name: Set up remote BuildKit
        uses: ./.github/actions/setup-remote-buildx

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan published image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-results.json
          exit-code: '0'

      - name: Report all Trivy findings and enforce severity gate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          trivy convert \
            --scanners vuln \
            --format table \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            trivy-results.json
          trivy convert \
            --scanners vuln \
            --format table \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            trivy-results.json
